[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/contact/submit"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/trial/submit"
  to = "/.netlify/functions/trial"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
